version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "mapbox-gl"
      # TypeScript 7 breaks ts-api-utils, which @eslint-react pulls in,
      # crashing `npm run lint` outright.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
